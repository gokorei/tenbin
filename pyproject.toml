[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tenbin"
version = "0.1.0"
description = "A measurement program built on the records Kojutsu captures. It reads; it does not collect."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "The Tenbin Authors" }]
keywords = ["measurement", "knowledge-management", "corpus-analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "typer>=0.12.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "pyyaml>=6.0.3",
    "mcp>=2,<3",
]

[project.optional-dependencies]
dev = [
    "mypy==1.18.2",
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "ruff==0.14.13",
    "types-PyYAML>=6.0.12",
]

[project.scripts]
tenbin = "tenbin.cli:app"

[project.urls]
Homepage = "https://github.com/gokorei/tenbin"
Repository = "https://github.com/gokorei/tenbin"
Issues = "https://github.com/gokorei/tenbin/issues"
Documentation = "https://github.com/gokorei/tenbin#readme"
Changelog = "https://github.com/gokorei/tenbin/releases"

[tool.hatch.build.targets.wheel]
packages = ["src/tenbin"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.pijul",
    "/.pijul/**",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
explicit_package_bases = true
# src only, by intent: ruff lints src tests scripts, but mypy typechecks the
# shipped package. Tests use fakes and dynamic fixtures that are deliberately
# loose, so typechecking them would either fail or force annotations that
# hide what the test is doing.
files = [
    "src/tenbin",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    # Talks to a real Tanseki store. Skipped unless one is reachable, so an absent
    # daemon never makes the suite red.
    "integration: exercises a real Tanseki store end to end",
]

[tool.coverage.run]
branch = true
relative_files = true
source = ["src/tenbin"]

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_covered = true
